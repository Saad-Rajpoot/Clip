title: "The Vienna Conduit: How a CIA Listening Post Mapped the Soviet Empire"
prompt: |
  A cinematic investigative documentary about a (fictional) Cold War signals-
  intelligence operation run out of Vienna between 1955 and 1979. Cover it like
  a Netflix true-history / Johnny Harris geopolitical film, with heavy geography,
  archival evidence, and chronology.
  - Open in divided post-war Vienna in 1955 — the four occupation sectors — then
    trace the intelligence network outward across the map: Vienna to Berlin,
    Berlin to Moscow, Moscow to Prague, and the courier route through Budapest
    and Belgrade to Istanbul.
  - Explain the geography of the Iron Curtain as a region: which territory each
    bloc controlled, the borders, the buffer states.
  - Show declassified CIA and KGB documents, field cables and newspaper front
    pages, logged with exact dates like an intelligence file.
  - Reveal the network of station chiefs, handlers, couriers and double agents
    connecting the listening post to Washington and Langley.
  - Walk through HOW the intercept-and-relay system worked, step by step — antenna,
    cipher, dead-drop, courier, analysis.
  - Give the hard numbers: how many intercepts per month, how many agents, the
    percentage of Soviet traffic decoded, the budget over the years.
  - Build a timeline of the operation from 1955 to its exposure in 1979, mapping
    each escalation onto the geography.
  Authoritative, tense, investigative — guide the viewer through the geography,
  the evidence, and the chronology of the Cold War in Central Europe.
fmt: documentary
duration: "6-8"
theme: crime
style: auto
background: auto
