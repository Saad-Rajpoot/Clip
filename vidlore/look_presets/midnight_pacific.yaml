# MIDNIGHT PACIFIC — Netflix cinematic investigative.
# Slow patient pacing, deep silence pockets before reveals, cold
# desaturated palette, heavy dissolves, restrained on-screen text.
# 4-6 AI character portraits per video (the "interview" beats).
name: midnight_pacific
label: "Midnight Pacific (Netflix cinematic investigative)"
inherits: standard
version: 1

tone: tense

# ── PACING — deliberate, breathy
# scene_count_mult 1.0 = brief default (the Netflix-doc baseline);
# the channel's identity lives in the long holds + deep silences,
# not in extra scene count.
scene_count_mult: 1.0
pacing_hint: "patient cinematic cadence — let silences land before each new beat, balance long observational scenes with sharp evidence-reveal scenes"
beat_target:    {min: 4.4, max: 5.2}
beat_min:       {min: 3.2, max: 3.8}
hook_seconds:   50
hook_beat_mult: {min: 0.65, max: 0.78}
climax_silence_mult: {min: 1.30, max: 1.55}
dissolve_gap:   {min: 2, max: 3}
dissolve_drop:  1
camera_easing:  ease_out_quint
# Midnight = controlled investigative drift.  0.80-0.92 sits
# between Amber's 0.50-0.60 and Atlas's 1.20-1.40 — felt as
# deliberate cinematic motion, not slideshow nor explainer push.
drift_scale:    {min: 0.80, max: 0.92}
hold_bias:      {min: 1.30, max: 1.55}
push_in_impact: {min: 1.05, max: 1.20}

# ── MOTION GRAPHICS — sparse, picked moments
graphic_density: {min: 0.85, max: 1.0}
density_per_min_max: 2
fav_templates:
  - name_reveal
  - quote_highlight
  - document
  - timeline
  - map_reveal
  - evidence
  - case_file
avoid_templates:
  - status_indicator
  - radio_dial
  - email_screenshot
  - sms_text
  - speech_bubble
  - countdown
  - hashtag_trend

# ── GRADE — cold, crushed shadows, desaturated
accent_rgb: [110, 145, 175]
grade:
  brightness_lift: {min: -0.08, max: -0.04}
  saturation_lift: {min: -0.14, max: -0.08}
  shadow_lift:     {min: 0.00,  max: 0.02}
  highlight_roll:  {min: -0.04, max: -0.02}
  warm_shadow_split: -0.014        # NEGATIVE = cool shadows

# ── FOOTAGE TASTE — biases Pexels search on the fallback rungs
# so when stock can't perfectly disambiguate, the channel's
# cinematic identity wins (dark, moody, restrained).
footage:
  query_suffix: "cinematic moody dramatic"

# ── AI — portraits drive this style
ai:
  per_video_floor:   1
  per_video_ceiling: 5
  fire_on_roles:     [hook, climax, reveal, name_reveal, evidence]
  fire_on_intensity: 3
  portrait_style:    candid
  grain_strength:    {min: 0.08, max: 0.12}
  diffusion_fallback: true

# ── MUSIC — investigative cues, deep beds
music:
  # Real categories — Netflix-doc investigative palette.
  # hard_filter pins music to the cool / tense / restrained end so
  # cinematic identity stays consistent.
  category_bias: [dark_investigation, suspense, mystery, emotional_piano, ambient]
  hard_filter: true
  intensity:      {min: 1.15, max: 1.30}
  density_floor:  {min: 0.50, max: 0.65}
  swell_on_climax: aggressive
  cue_min_seconds: 20

# ── SILENCE — the cinematic signature
silence:
  tier2_pocket_s: {min: 0.70, max: 0.85}
  tier3_pocket_s: {min: 1.30, max: 1.55}
  tier3_stretch_s: {min: 0.55, max: 0.70}
  pre_roll_t3_s:   {min: 0.60, max: 0.70}

# ── SFX — restrained, deep booms
sfx:
  whoosh_min_gap_s: {min: 18, max: 24}
  boom_min_gap_s:   {min: 32, max: 42}
  amplitude:        {min: 0.55, max: 0.70}
  reveal_stinger:   bell_subdrop

# ── REVEAL PSYCHOLOGY — Midnight pulls music down on TENSION /
# EVIDENCE reveals.  Hidden facts, contradictions, missing pieces.
reveal:
  tier2: [evidence, "the evidence shows", "no record", "no trace",
          concealed, hidden, "the truth was", "what we found",
          "the question was", missing, redacted, classified]
  tier3_boost: [evidence, concealed, hidden, missing, redacted,
                classified, "no record", "no trace", "the truth"]

# ── TEXT — minimal type on screen
text:
  emphasis_fire_prob_density:   0.75
  emphasis_fire_prob_restraint: {min: 0.25, max: 0.40}
  text_density_target_pct:      {min: 6, max: 14}

fonts:
  display: [Helvetica Neue, Inter, VidloreSans]
  body:    [Source Serif Pro, Crimson, VidloreSans]
  weight_bias: regular

# ── CAPTIONS — premium minimal investigative.
# max_words 6 + max_dur 3.6 = the documentary default with a
# slightly looser breath.  Mid 180ms fades feel investigative,
# slightly lifted off the bottom (margin 1.08), Helvetica Neue
# chain matches the Netflix-doc card chrome.
captions:
  max_words: 6
  max_dur_s: 3.6
  size_mult: 1.00
  fade_in_ms: 180
  fade_out_ms: 180
  margin_v_mult: 1.08
  font_family: [Helvetica Neue, Inter, Source Sans]

intro:
  cold_open_s: 10
  title_hold_s: 2.8
  hook_compression: 1.4

climax:
  hold_s: {min: 10, max: 16}
  pre_silence_s: {min: 1.5, max: 1.9}

animation:
  default_easing: ease_out_quint
  philosophy: cinematic_restraint
