title: "The 1860s Secret: How Two Cheap Metals End Garden Pests Forever"
prompt: |
  A faceless documentary uncovering a forgotten 1860s homestead method:
  burying thin strips of copper and zinc around garden beds creates a tiny
  galvanic field in the soil that repels slugs, beetles and aphids without
  any chemicals. Frame it as suppressed old-ways knowledge the pesticide
  industry buried. Walk through: the discovery, an Amish elder who still
  uses it, the science of the galvanic effect, field-trial results
  (percentages), how to set it up, and why it vanished from gardening
  books after WWII. Authoritative, curious, slightly conspiratorial.
fmt: documentary
duration: "6-8"
